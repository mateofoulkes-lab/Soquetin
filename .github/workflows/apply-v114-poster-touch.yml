name: Apply V1.14 poster fix

on:
  push:
    paths:
      - '.github/workflows/apply-v114-poster-touch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v114_poster_touch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Poster 03 asset and touch interaction (V1.14)" || exit 0
          git push

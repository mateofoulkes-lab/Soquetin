name: Rollback final textures

on:
  push:
    paths:
      - '.github/workflows/rollback-final-textures.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous stable texture block
        run: python3 rollback_final_textures.py
      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rollback final texture overrides" || exit 0
          git push

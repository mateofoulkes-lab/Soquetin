name: Apply V1.18 mobile poster controls

on:
  push:
    paths:
      - '.github/workflows/apply-v118-mobile-posters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v118_mobile_posters.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile joystick and front-face poster interaction (V1.18)" || exit 0
          git push

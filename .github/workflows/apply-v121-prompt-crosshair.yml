name: Apply V1.21 prompt and crosshair

on:
  push:
    paths:
      - '.github/workflows/apply-v121-prompt-crosshair.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v121_prompt_crosshair.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify poster prompt and remove crosshair (V1.21)" || exit 0
          git push

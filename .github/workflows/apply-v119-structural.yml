name: Apply V1.19 structural changes

on:
  push:
    paths:
      - '.github/workflows/apply-v119-structural.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v119_structural.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename game and add preload splash (V1.19)" || exit 0
          git push

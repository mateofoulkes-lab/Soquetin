name: Apply V1.12 posters

on:
  push:
    paths:
      - '.github/workflows/apply-v112-posters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use raster Poster 03 and patch game
        run: |
          sed -i 's/poster03-protocolo\.svg/poster03-protocolo.jpg/g' patch_v112_posters.py
          python3 patch_v112_posters.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add interactive enlarged posters and Poster 03 artwork (V1.12)" || exit 0
          git push

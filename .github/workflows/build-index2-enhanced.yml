name: Build enhanced index2

on:
  push:
    paths:
      - '.github/workflows/build-index2-enhanced.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate index2
        run: python3 patch_enhanced_index2.py
      - name: Syntax-check module script
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index2.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script missing'
          pathlib.Path('/tmp/index2.mjs').write_text(m.group(1))
          PY
          node --check /tmp/index2.mjs
      - name: Commit index2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index2.html
          git commit -m "Add enhanced alternate game version" || exit 0
          git push

name: Apply V1.13 poster fix

on:
  push:
    paths:
      - '.github/workflows/apply-v113-poster-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v113_poster_fix.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix poster rendering and mobile tap interaction (V1.13)" || exit 0
          git push

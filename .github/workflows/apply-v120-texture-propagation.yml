name: Apply V1.20 texture propagation

on:
  push:
    paths:
      - '.github/workflows/apply-v120-texture-propagation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v120_texture_propagation.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Propagate tuned UVs to similar architecture (V1.20)" || exit 0
          git push

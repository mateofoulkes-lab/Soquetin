name: Apply V1.9 lava cinematic

on:
  push:
    paths:
      - '.github/workflows/apply-v19-lava-cinematic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v19_lava_cinematic.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Freeze death camera, slow lava sink and expand smoke (V1.9)" || exit 0
          git push

name: Apply Soquetin model

on:
  push:
    paths:
      - '.github/workflows/apply-soquetin-model.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 patch_soquetin_model.py
      - name: Commit model integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use provisional Soquetin GLB as player model" || exit 0
          git push

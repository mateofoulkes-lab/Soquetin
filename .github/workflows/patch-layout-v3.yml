name: Patch Soquetin layout v3

on:
  push:
    paths:
      - '.github/workflows/patch-layout-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 patch_v3.py
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Widen challenge tiles and platforms, fix thresholds and jump range"
          git push

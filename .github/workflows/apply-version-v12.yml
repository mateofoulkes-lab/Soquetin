name: Apply V1.2 label
on:
  push:
    paths:
      - '.github/workflows/apply-version-v12.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch version
        run: python3 patch_version_v12.py
      - name: Commit version label
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mark GLB test build as V1.2" || exit 0
          git push

name: Apply last two wall textures

on:
  push:
    paths:
      - '.github/workflows/apply-last-two-walls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final textures and sync editor
        run: python3 patch_last_two_walls.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html texture-editor.html
          git commit -m "Apply final wall texture corrections" || exit 0
          git push

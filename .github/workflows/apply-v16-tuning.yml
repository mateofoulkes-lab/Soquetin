name: Apply V1.6 tuning

on:
  push:
    paths:
      - '.github/workflows/apply-v16-tuning.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v16_tuning.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tune character lighting, jump, camera and thresholds (V1.6)" || exit 0
          git push

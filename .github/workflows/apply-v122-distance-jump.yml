name: Apply V1.22 distance and jump

on:
  push:
    paths:
      - '.github/workflows/apply-v122-distance-jump.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v122_distance_jump.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Tighten poster proximity and increase jump (V1.22)" || exit 0
          git push

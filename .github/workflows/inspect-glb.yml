name: Inspect GLB
on:
  push:
    paths:
      - '.github/workflows/inspect-glb.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 inspect_glb.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glb-diagnostic.json
          git commit -m "Inspect provisional Soquetin GLB" || exit 0
          git push

name: Apply V1.17 poster path

on:
  push:
    paths:
      - '.github/workflows/apply-v117-poster-path.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v117_poster_path.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Point Poster 03 to 1000142570.jpg (V1.17)" || exit 0
          git push

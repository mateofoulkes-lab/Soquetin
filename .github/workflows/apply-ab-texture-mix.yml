name: Apply A/B texture mix

on:
  push:
    paths:
      - '.github/workflows/apply-ab-texture-mix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mixed texture table
        run: python3 patch_apply_ab_texture_mix.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply selected A/B texture mix" || exit 0
          git push

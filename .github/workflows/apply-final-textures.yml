name: Apply final texture overrides

on:
  push:
    paths:
      - '.github/workflows/apply-final-textures.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final texture overrides
        run: python3 patch_final_texture_overrides.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply final texture overrides" || exit 0
          git push

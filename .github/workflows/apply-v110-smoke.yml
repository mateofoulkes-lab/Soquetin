name: Apply V1.10 smoke tuning

on:
  push:
    paths:
      - '.github/workflows/apply-v110-smoke.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v110_smoke.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine lava smoke particles (V1.10)" || exit 0
          git push

name: Apply jump tilt and editor base

on:
  push:
    paths:
      - '.github/workflows/apply-jump-editor-base.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game and editor
        run: python3 patch_jump_and_editor_base.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html texture-editor.html
          git commit -m "Keep stationary jumps upright and update editor baseline" || exit 0
          git push

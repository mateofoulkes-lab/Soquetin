name: Apply V1.15 poster final fix

on:
  push:
    paths:
      - '.github/workflows/apply-v115-poster-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v115_poster_final.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use verified Poster 03 and robust touch interaction (V1.15)" || exit 0
          git push

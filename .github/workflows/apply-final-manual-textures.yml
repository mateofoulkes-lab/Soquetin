name: Apply final manual textures

on:
  push:
    paths:
      - '.github/workflows/apply-final-manual-textures.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game and editor textures
        run: python3 patch_final_manual_textures.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html texture-editor.html
          git commit -m "Apply manual texture corrections and update editor baseline" || exit 0
          git push

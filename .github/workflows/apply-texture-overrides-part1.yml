name: Apply texture overrides part 1

on:
  push:
    paths:
      - '.github/workflows/apply-texture-overrides-part1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply texture overrides
        run: python3 patch_texture_overrides_part1.py
      - name: Commit updated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply first texture alignment pass"
          git push

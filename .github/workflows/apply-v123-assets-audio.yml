name: Apply V1.23 assets and audio

on:
  push:
    paths:
      - '.github/workflows/apply-v123-assets-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v123_assets_audio.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link final posters and sound effects (V1.23)" || exit 0
          git push

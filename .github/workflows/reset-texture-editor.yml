name: Reset texture editor baseline

on:
  push:
    paths:
      - '.github/workflows/reset-texture-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reset editor baseline
        run: python3 patch_reset_texture_editor.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add texture-editor.html
          git commit -m "Reset texture editor to current game textures" || exit 0
          git push

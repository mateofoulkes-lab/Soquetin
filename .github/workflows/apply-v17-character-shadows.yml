name: Apply V1.7 character shadows

on:
  push:
    paths:
      - '.github/workflows/apply-v17-character-shadows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        run: python3 patch_v17_character_shadows.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Brighten Soquetin material and add room-light shadows (V1.7)" || exit 0
          git push

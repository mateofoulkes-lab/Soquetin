<svg xmlns="http://www.w3.org/2000/svg" width="1647" height="955" viewBox="0 0 1647 955">
<defs>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="7" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g"><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
  <style>
    .ink{fill:#171717;stroke:#171717}.line{fill:none;stroke:#171717;stroke-width:5}.thin{fill:none;stroke:#171717;stroke-width:2}.t{font-family:Arial,Helvetica,sans-serif;fill:#171717;font-weight:800}.head{font-size:70px;letter-spacing:5px}.label{font-size:31px;letter-spacing:2px}.small{font-size:25px}.foot{font-size:31px;font-weight:700}.white{fill:#f4f0e5}
  </style>
</defs>
<rect width="1647" height="955" fill="#eee8d9"/><rect width="1647" height="955" filter="url(#paper)" opacity=".45"/>
<path class="line" d="M32 80 80 30h1487l48 50v795l-40 40H72l-40-40z"/>
<path class="thin" d="M64 110V65h44M1539 65h44v45M64 845v45h44M1539 890h44v-45"/>
<text class="t head" x="823.5" y="132" text-anchor="middle">PROTOCOLO DE DESPLAZAMIENTO</text>

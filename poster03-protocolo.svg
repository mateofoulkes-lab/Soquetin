 <text class="t white" font-size="56" text-anchor="middle" x="162" y="68">W</text><text class="t white" font-size="56" text-anchor="middle" x="47" y="173">A</text><text class="t white" font-size="56" text-anchor="middle" x="162" y="173">S</text><text class="t white" font-size="56" text-anchor="middle" x="277" y="173">D</text>
 <text class="t label" x="162" y="258" text-anchor="middle">MOVERSE</text>
</g>
<!-- space -->
<g transform="translate(640 235)"><rect class="ink" x="0" y="0" width="385" height="105" rx="12"/><rect x="157" y="48" width="72" height="7" rx="4" fill="#eee8d9"/><text class="t label" x="192" y="178" text-anchor="middle">SALTAR</text></g>
<!-- mouse -->

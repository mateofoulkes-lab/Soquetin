<path class="ink" d="M665 482h317l30 32-30 32H665l-30-32z"/><text x="823.5" y="527" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#eee8d9" letter-spacing="5">MÓVIL</text>
